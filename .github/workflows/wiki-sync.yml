name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'

jobs:
  update-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Sync Wiki
        uses: Andrew-Chen-Wang/github-wiki-action@v4
        with:
          path: wiki
          # The WIKI_ACTION_TOKEN must be added to the repository's Action Secrets.
          # It should be a Personal Access Token (PAT) with repo/wiki permissions.
          token: ${{ secrets.WIKI_ACTION_TOKEN }}
